name: Build rootfs sony-keyaki

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && \
            sudo apt-get install -y -o Acquire::Retries=5 qemu-user-static binfmt-support android-sdk-libsparse-utils git openssl && break
            [ "$i" = 5 ] && exit 1
            echo "apt falhou, tentando de novo em 30s ($i/5)"
            sleep 30
          done
          sudo update-binfmts --enable qemu-aarch64 || true
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -s "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clonar pmaports e adicionar o device
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$HOME/pmaports"
          ls "$HOME/pmaports/pmaports.cfg"
          echo "Conteudo da pasta pmaports do projeto:"
          ls -la pmaports
          DEST="$HOME/pmaports/device/testing/device-sony-keyaki"
          mkdir -p "$DEST"
          cp -r pmaports/. "$DEST/"
          grep -q rootfs_image_sector_size "$DEST/deviceinfo" || echo 'deviceinfo_rootfs_image_sector_size="4096"' >> "$DEST/deviceinfo"
          cat "$DEST/deviceinfo"

      - name: Configurar pmbootstrap
        run: |
          mkdir -p "$HOME/.local/var/pmbootstrap/cache_git"
          echo 8 > "$HOME/.local/var/pmbootstrap/version"
          mkdir -p "$HOME/.config"
          cat > "$HOME/.config/pmbootstrap_v3.cfg" <<EOF
          [pmbootstrap]
          aports = $HOME/pmaports
          device = sony-keyaki
          ui = console
          user = user
          work = $HOME/.local/var/pmbootstrap
          EOF
          pmbootstrap status
          
      - name: Gerar o rootfs
        run: |
          pmbootstrap -t 3000 -y install --no-fde --password pmos

      - name: Converter para sparse
        run: |
          IMG=$(find "$HOME/.local/var/pmbootstrap" -name 'sony-keyaki.img' -type f | head -n1)
          if [ -z "$IMG" ]; then
            echo "Imagem sony-keyaki.img nao encontrada!"
            exit 1
          fi
          mkdir -p out-build
          cp "$IMG" out-build/sony-keyaki.raw
          img2simg out-build/sony-keyaki.raw out-build/sony-keyaki.sparse.img
          ls -lh out-build

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: sony-keyaki-rootfs
          path: out-build/sony-keyaki.sparse.img
          retention-days: 7
          
      - name: Mostrar log do pmbootstrap se falhar
        if: failure()
        run: |
          tail -n 120 "$HOME/.local/var/pmbootstrap/log.txt"
