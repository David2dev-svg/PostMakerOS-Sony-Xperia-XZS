name: Build rootfs sony-keyaki

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support \
            android-sdk-libsparse-utils git python3-pip
          pip install --user pmbootstrap
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clonar pmaports e adicionar o device
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$HOME/pmaports"
          DEST="$HOME/pmaports/device/testing/device-sony-keyaki"
          mkdir -p "$DEST"
          cp -r pmaports/. "$DEST/"
          # garante setor de 4096 bytes (o initfs-hook.sh espera isso)
          grep -q rootfs_image_sector_size "$DEST/deviceinfo" || \
            echo 'deviceinfo_rootfs_image_sector_size="4096"' >> "$DEST/deviceinfo"
          cat "$DEST/deviceinfo"

      - name: Configurar pmbootstrap
        run: |
          pmbootstrap --version
          pmbootstrap config aports "$HOME/pmaports"
          pmbootstrap config device sony-keyaki
          pmbootstrap config ui console

      - name: Gerar o rootfs
        run: |
          # senha do usuario: troque depois de logar
          pmbootstrap -y install --no-fde --password pmos

      - name: Converter para sparse
        run: |
          IMG=$(find "$HOME/.local/var/pmbootstrap" -name 'sony-keyaki.img' | head -n1)
          echo "Imagem: $IMG"
          mkdir -p out-build
          cp "$IMG" out-build/sony-keyaki.raw
          img2simg out-build/sony-keyaki.raw out-build/sony-keyaki.sparse.img
          ls -lh out-build

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: sony-keyaki-rootfs
          path: out-build/sony-keyaki.sparse.img
          retention-days: 7
          
